[package]
name = "mchose-battery"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "MCHOSE / 迈从 mouse battery in the Windows taskbar and KDE system tray"
license = "MIT"
readme = "README.md"
repository = "https://github.com/QPRS-6/mchose_battery"
homepage = "https://github.com/QPRS-6/mchose_battery"

[lib]
name = "mchose_battery"
path = "src/lib.rs"

[[bin]]
name = "mchose-battery"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
tray-icon = { version = "0.26", default-features = false }
winit = "0.30"
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
